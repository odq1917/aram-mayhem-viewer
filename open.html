<!DOCTYPE html>
<html lang=ko>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0>
  <title>MAYHEM.GG - 실행 중</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .launcher-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(168, 85, 247, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .logo {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #a855f7, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .status-text {
      font-size: 15px;
      color: #94a3b8;
      font-weight: 500;
    }
    .sub-hint {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class=launcher-box>
    <div class=spinner></div>
    <div class=logo>MAYHEM.GG</div>
    <div class=status-text id=statusText>아수라장 전적 서버를 실행하고 있습니다...</div>
    <div class=sub-hint>잠시 후 전적 대시보드로 자동 이동합니다.</div>
  </div>

  <iframe id=protocolFrame style=display:none;></iframe>

  <script>
    // 1. 백그라운드 서버 실행 프로토콜 호출
    const frame = document.getElementById('protocolFrame');
    frame.src = 'aram-mayhem://open';

    // 2. 서버가 응답할 때까지 스마트 헬스체크 후 자동 이동
    let attempts = 0;
    const maxAttempts = 25;

    async function checkAndRedirect() {
      attempts++;
      try {
        await fetch('http://localhost:3500/api/status', { mode: 'no-cors' });
        window.location.replace('http://localhost:3500');
      } catch (e) {
        if (attempts < maxAttempts) {
          setTimeout(checkAndRedirect, 250);
        } else {
          window.location.replace('http://localhost:3500');
        }
      }
    }

    setTimeout(checkAndRedirect, 350);
  </script>
</body>
</html>
