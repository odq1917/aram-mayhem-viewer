<!DOCTYPE html>
<html lang=ko>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0>
  <title>MAYHEM.GG - 실행 중</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .launcher-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(168, 85, 247, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .logo {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #a855f7, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .status-text {
      font-size: 15px;
      color: #94a3b8;
      font-weight: 500;
    }
    .sub-hint {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class=launcher-box>
    <div class=spinner></div>
    <div class=logo>MAYHEM.GG</div>
    <div class=status-text id=statusText>아수라장 전적 서버를 실행하고 있습니다...</div>
    <div class=sub-hint>잠시 후 전적 대시보드로 자동 이동합니다.</div>
  </div>

  <iframe id=protocolFrame style=display:none;></iframe>

  <script>
    const DASHBOARD = 'http://localhost:3500';

    // 서버 응답 여부만 확인 (file:// 페이지라 응답 내용은 읽지 않음)
    async function serverIsUp() {
      try {
        await fetch(DASHBOARD + '/api/ping', { mode: 'no-cors', signal: AbortSignal.timeout(800) });
        return true;
      } catch (e) {
        return false;
      }
    }

    async function start() {
      // 1. 이미 켜져 있으면 바로 이동 (서버 중복 실행 방지)
      if (await serverIsUp()) {
        window.location.replace(DASHBOARD);
        return;
      }

      // 2. 꺼져 있으면 프로토콜로 백그라운드 서버 실행 후 응답 대기
      document.getElementById('protocolFrame').src = 'aram-mayhem://open';
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 250));
        if (await serverIsUp()) break;
      }
      window.location.replace(DASHBOARD);
    }

    start();
  </script>
</body>
</html>
